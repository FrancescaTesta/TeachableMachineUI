name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # Repo normale: il sito vive in https://<utente>.github.io/<repo>/
        # Repo <utente>.github.io: il sito vive alla radice, https://<utente>.github.io/
        run: |
          case "$REPO" in
            *.github.io) export BASE_PATH=/ ;;
            *) export BASE_PATH="/$REPO/" ;;
          esac
          echo "BASE_PATH=$BASE_PATH"
          npm run build
        env:
          REPO: ${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true # attiva GitHub Pages (sorgente Actions) se non lo e' gia'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
